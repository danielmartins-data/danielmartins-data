<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="280" viewBox="0 0 1200 280" role="img" aria-label="Daniel Fernando Martins, Analista de Dados">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0B1F3A"/>
      <stop offset="0.55" stop-color="#14508C"/>
      <stop offset="1" stop-color="#0FA3B1"/>
    </linearGradient>
    <linearGradient id="bar" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.05"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0.28"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="280" rx="18" fill="url(#bg)"/>
  <!-- grade sutil -->
  <g stroke="#FFFFFF" stroke-opacity="0.06">
    <path d="M0 70H1200M0 140H1200M0 210H1200"/>
  </g>
  <!-- barras decorativas -->
  <g fill="url(#bar)">
    <rect x="760" y="170" width="46" height="90" rx="6"/>
    <rect x="826" y="140" width="46" height="120" rx="6"/>
    <rect x="892" y="150" width="46" height="110" rx="6"/>
    <rect x="958" y="105" width="46" height="155" rx="6"/>
    <rect x="1024" y="80" width="46" height="180" rx="6"/>
    <rect x="1090" y="45" width="46" height="215" rx="6"/>
  </g>
  <!-- linha de tendência -->
  <polyline points="783,150 849,118 915,128 981,84 1047,58 1113,26" fill="none" stroke="#FFD166" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  <g fill="#FFD166">
    <circle cx="783" cy="150" r="7"/><circle cx="849" cy="118" r="7"/><circle cx="915" cy="128" r="7"/>
    <circle cx="981" cy="84" r="7"/><circle cx="1047" cy="58" r="7"/><circle cx="1113" cy="26" r="7"/>
  </g>
  <!-- textos -->
  <text x="64" y="112" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="54" font-weight="700" fill="#FFFFFF">Daniel Fernando Martins</text>
  <text x="66" y="156" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="28" fill="#BFE9F0">Analista de Dados  |  Negócios + Dados</text>
  <!-- chips -->
  <g font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="18" font-weight="600" text-anchor="middle">
    <rect x="66" y="188" width="116" height="40" rx="20" fill="#F2C811"/><text x="124" y="214" fill="#1B1B1B">Power BI</text>
    <rect x="194" y="188" width="82" height="40" rx="20" fill="#FFFFFF"/><text x="235" y="214" fill="#14508C">SQL</text>
    <rect x="288" y="188" width="104" height="40" rx="20" fill="#3776AB"/><text x="340" y="214" fill="#FFFFFF">Python</text>
    <rect x="404" y="188" width="100" height="40" rx="20" fill="#217346"/><text x="454" y="214" fill="#FFFFFF">Excel</text>
